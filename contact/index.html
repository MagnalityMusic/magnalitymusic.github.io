<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../assets/magnality-favicon.jpg" />
    <title>contact | magnality</title>
  </head>

  <body>
    <header>
      <div class="header-content">
        <a href="../">magnality</a>

        <nav>
          <a href="../music/">music</a>
          <a href="../sound/">sound</a>
          <a href="../apps/">apps</a>
          <a href="../licence/">licence</a>
          <a href="../contact/" class="active">contact</a>
          <a href="../faq/">faq</a>
        </nav>
      </div>
    </header>

    <main>
      <form class="contact-form">
        <label for="email">Email</label>

        <input type="email" id="email" name="email" required />

        <label for="subject">Subject</label>

        <select id="subject" name="subject" required>
          <option value="">Select a subject</option>
          <option value="Music Enquiry">Music Enquiry</option>
          <option value="Extended Licence">Extended Licence</option>
          <option value="Soundtrack Licence">Soundtrack Licence</option>
          <option value="Other">Other</option>
        </select>

        <label for="message">Message</label>

        <textarea id="message" name="message" rows="8" required></textarea>

        <button type="submit">Send Message</button>
      </form>

      <p class="contact-note">
        Your email app should open after clicking Send. If it doesn't, you can
        email me directly at
        <a href="mailto:magnalitymusic@gmail.com"> magnalitymusic@gmail.com </a>
      </p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const subject = params.get("subject");

      if (subject) {
        document.querySelector("#subject").value = subject;
      }

      const form = document.querySelector(".contact-form");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const email = document.querySelector("#email").value;
        const subject = document.querySelector("#subject").value;
        const message = document.querySelector("#message").value;

        const body = "From: " + email + "\n\n" + message;

        window.location.href =
          "mailto:magnalitymusic@gmail.com" +
          "?subject=" +
          encodeURIComponent(subject) +
          "&body=" +
          encodeURIComponent(body);
      });
    </script>
    <footer>
      <div class="footer-content">
        <nav class="socials">
          <a
            href="https://www.youtube.com/@MagnalityMusic"
            target="_blank"
            rel="noopener"
          >
            <i class="fa-brands fa-youtube"></i>
          </a>

          <a
            href="https://discord.gg/kajS2chz2y"
            target="_blank"
            rel="noopener"
          >
            <i class="fa-brands fa-discord"></i>
          </a>

          <a
            href="https://www.instagram.com/magnality_music"
            target="_blank"
            rel="noopener"
          >
            <i class="fa-brands fa-instagram"></i>
          </a>

          <a
            href="https://x.com/magnality_music"
            target="_blank"
            rel="noopener"
          >
            <i class="fa-brands fa-x-twitter"></i>
          </a>
        </nav>

        <a
          href="https://ko-fi.com/magnality_music"
          class="footer-brand"
          target="_blank"
          rel="noopener"
          >buy me a coffee</a
        >
      </div>
    </footer>
  </body>
</html>
